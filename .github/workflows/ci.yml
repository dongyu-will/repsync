name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: go mod download
      - run: sh tools/shared/check-go-format.sh cmd internal
      - run: npm --prefix frontend run check
      - run: go vet ./...
      - run: go test -tags=integration -race ./internal/workspace ./internal/control
      - run: npm --prefix frontend run build
      - name: Build browser demo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm --prefix frontend run build -- --base=/repsync/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: frontend/dist

  demo:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser demo
        id: deployment
        uses: actions/deploy-pages@v4
